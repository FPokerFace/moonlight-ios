name: Build Moonlight iOS

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee xcodebuild.log

      - name: Package and verify IPA
        run: |
          set -euo pipefail
          PRODUCT_DIR="build/Build/Products/Release-iphoneos"
          APP="$(find "$PRODUCT_DIR" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          test -f "$APP/Info.plist"

          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -n "$EXECUTABLE"
          test -f "$APP/$EXECUTABLE"

          rm -rf Payload Moonlight-unsigned.ipa
          mkdir Payload
          ditto "$APP" "Payload/$(basename "$APP")"
          zip -qry Moonlight-unsigned.ipa Payload

          test -s Moonlight-unsigned.ipa
          unzip -t Moonlight-unsigned.ipa
          ls -lh Moonlight-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-iOS-unsigned
          path: Moonlight-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-iOS-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
